name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Run tests
        run: pytest -q

      - name: Generate sample configuration
        run: >-
          python scripts/generate_config.py
          --inventory inventory/lab-devices.yaml
          --template templates/junos_bgp.j2
          --output-dir generated

      - name: Validate healthy sample
        run: >-
          python scripts/validate_bgp.py
          --input sample-data/bgp-healthy.json
          --expected inventory/lab-devices.yaml
          --device ott-pe-01
